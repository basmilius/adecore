name: 🚀 Release

on:
  release:
    types: [prereleased, released]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.2.0 or 1.2.0-beta.1)'
        required: true
        type: string
      prerelease:
        description: 'Publish under the "next" dist-tag'
        required: false
        default: false
        type: boolean

env:
  RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
  IS_PRERELEASE: ${{ github.event.release.prerelease || inputs.prerelease }}

permissions:
  contents: read
  # npm Trusted Publishing: npm trades this token for a short-lived publish credential, so no npm token is stored.
  id-token: write

jobs:
  # The helper is native, so it is built once per platform on a runner of that platform (macOS builds both of its architectures). Ubuntu 22.04 keeps the glibc floor of the Linux binaries low.
  helper:
    name: 🦀 Build the helper (${{ matrix.package }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - package: database-darwin-arm64
            os: macos-14
            target: aarch64-apple-darwin
            binary: adecore-database
          - package: database-linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: adecore-database
          - package: database-linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            binary: adecore-database
          - package: database-win32-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: adecore-database.exe
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v6

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 💾 Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/database/helper
          key: ${{ matrix.target }}

      - name: 🔨 Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        working-directory: packages/database/helper

      # Staged as `bin/<binary>` so the artifact unpacks straight into the folder of its package.
      - name: 📦️ Stage the binary
        shell: bash
        run: |
          mkdir -p stage/bin
          cp "packages/database/helper/target/${{ matrix.target }}/release/${{ matrix.binary }}" stage/bin/

      - name: ⬆️ Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: stage
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: helper
    name: 🚀 Publish to npm
    steps:
      - name: 🔒 Validate release version
        run: |
          # A tag may carry a leading `v`; the version in package.json never does.
          version="${RELEASE_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid release version '$RELEASE_VERSION'; expected a semver like 1.2.3 or 1.2.3-beta.1."
              exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: 👀 Checkout
        uses: actions/checkout@v6

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: ✨ Setup node 25.x
        uses: actions/setup-node@v6
        with:
          node-version: '25.x'
          registry-url: https://registry.npmjs.org

      - name: 📦️ Install dependencies
        run: bun install --frozen-lockfile

      # Every package carries the same version, so one tag releases them all. After the install, since the lockfile holds the version a workspace had.
      # The optional dependencies on the platform packages follow, or the published package would ask for a version that does not exist.
      # A peer on another package of this release asks for this minor, which is what a 0.x caret means.
      - name: ✏️ Version ${{ env.RELEASE_VERSION }}
        run: |
          for manifest in packages/*/package.json; do
              jq --arg version "$RELEASE_VERSION" '
                  .version = $version
                  | if .optionalDependencies then
                      .optionalDependencies |= with_entries(if (.key | startswith("@adecore/")) then .value = $version else . end)
                  else . end
                  | if .peerDependencies then
                      .peerDependencies |= with_entries(if (.key | startswith("@adecore/")) then .value = "^" + $version else . end)
                  else . end
              ' "$manifest" > "$manifest.tmp"
              mv "$manifest.tmp" "$manifest"
          done

      # Before the tests: a test that imports another package of the repository reads its `dist`.
      - name: 🔨 Build
        run: bun run build

      - name: 🔍 Check and test
        run: |
          bun run check
          bun run test

      # One artifact per platform package, each holding `bin/`. After the check and the build so those never see a binary, before the publish so `files` picks it up.
      - name: ⬇️ Download the helper binaries
        uses: actions/download-artifact@v4
        with:
          pattern: database-*
          path: packages

      # An artifact loses the executable bit on upload.
      - name: 🔑 Make the helper binaries executable
        run: chmod +x packages/database-*/bin/adecore-database

      - name: 🚀 Publish ${{ env.RELEASE_VERSION }}
        run: |
          tag_args=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
              tag_args=(--tag next)
          fi

          # The platform packages go first: the package that lists them as optional dependencies must find them on the registry.
          declare -A seen
          for dir in packages/database-*/ packages/*/; do
              if [[ -n "${seen[$dir]:-}" ]]; then
                  continue
              fi
              seen[$dir]=1

              if [[ "$(jq -r '.private // false' "$dir/package.json")" == "true" ]]; then
                  continue
              fi

              name=$(jq -r '.name' "$dir/package.json")

              if npm view "$name@$RELEASE_VERSION" version >/dev/null 2>&1; then
                  echo "::notice::$name@$RELEASE_VERSION is already published, skipping."
                  continue
              fi

              (cd "$dir" && npm publish --provenance --access public "${tag_args[@]}")
          done

      - name: 📚 Build the docs
        run: bun run --cwd docs build

      # A prerelease uploads a version of the docs without sending traffic to it; the live site stays on the last release.
      - name: 🚀 Publish the docs (prerelease)
        uses: cloudflare/wrangler-action@v3
        if: ${{ env.IS_PRERELEASE == 'true' }}
        with:
          accountId: 5e565cf9fa55b0eae1f8131903da2ca9
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: versions upload --tag prerelease-${{ env.RELEASE_VERSION }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4.141.0'

      - name: 🚀 Publish the docs
        uses: cloudflare/wrangler-action@v3
        if: ${{ env.IS_PRERELEASE != 'true' }}
        with:
          accountId: 5e565cf9fa55b0eae1f8131903da2ca9
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4.141.0'
