name: PHP language server

on:
  push:
    branches: [main]
    paths: ['packages/php-language-server/**', '.github/workflows/php-language-server.yml']
  pull_request:
    paths: ['packages/php-language-server/**', '.github/workflows/php-language-server.yml']
  workflow_call:
    inputs:
      release_tag:
        description: Existing Adecore release tag, or empty for validation only
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Adecore release tag whose native assets should be generated
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/php-language-server
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Format, lint and test
        working-directory: packages/php-language-server
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          python scripts/test-native-release.py

  native:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-14
            target: aarch64-apple-darwin
            binary: php-language-server
          - platform: darwin-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            binary: php-language-server
          - platform: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            binary: php-language-server
          - platform: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: php-language-server
          - platform: win32-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: php-language-server.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/php-language-server
          key: ${{ matrix.target }}
      - name: Build native binary
        working-directory: packages/php-language-server
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check real stdio transport
        working-directory: packages/php-language-server
        run: python scripts/handshake.py target/${{ matrix.target }}/release/${{ matrix.binary }}
      - name: Generate archive and pinned asset descriptor
        if: inputs.release_tag != ''
        shell: bash
        working-directory: packages/php-language-server
        env:
          PHP_RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/native-release.py asset --binary "target/${{ matrix.target }}/release/${{ matrix.binary }}" --platform "${{ matrix.platform }}" --tag "$PHP_RELEASE_TAG" --output artifacts
      - uses: actions/upload-artifact@v4
        if: inputs.release_tag != ''
        with:
          name: php-language-server-${{ matrix.platform }}
          path: packages/php-language-server/artifacts
          if-no-files-found: error
          retention-days: 7

  descriptor:
    if: inputs.release_tag != ''
    needs: native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: php-language-server-*
          path: native-artifacts
      - name: Verify archives and merge platform descriptors
        run: python packages/php-language-server/scripts/native-release.py merge --input native-artifacts --output native-artifacts/php-language-server-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: php-language-server-release
          path: native-artifacts
          if-no-files-found: error
          retention-days: 7
